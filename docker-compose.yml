# Application et base de données.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobboard
      POSTGRES_PASSWORD: jobboard_pass_123   # VULN-4 : secret en clair (valeur de test)
      POSTGRES_DB: jobboard
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: ./app
    image: jobboard-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: jobboard
      DB_PASSWORD: jobboard_pass_123
      DB_NAME: jobboard
    depends_on:
      - db

volumes:
  dbdata: