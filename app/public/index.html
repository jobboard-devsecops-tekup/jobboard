<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobBoard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F4F6FA;color:#0F1B33}
a{color:#1F5FBF}nav{display:flex;justify-content:space-between;align-items:center;height:64px;padding:0 40px;background:#fff;border-bottom:1px solid #E1E5EB}
nav .l{display:flex;gap:28px;align-items:center}nav b{font-size:22px}nav b span{color:#1F5FBF}nav a{text-decoration:none;color:#4A5568}
main{max-width:1000px;margin:0 auto;padding:32px}h1{font-size:28px;margin:0 0 20px}
.card{background:#fff;border:1px solid #E1E5EB;border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,27,51,.06)}
.row{display:flex;gap:12px;align-items:center}.row.sp{justify-content:space-between}
input,select,textarea{width:100%;min-height:44px;border:1px solid #C8CFDA;border-radius:8px;padding:8px 12px;font:inherit;background:#fff}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;margin-bottom:14px}
button{min-height:44px;padding:0 20px;border:0;border-radius:8px;background:#1F5FBF;color:#fff;font-weight:600;cursor:pointer;font:inherit;font-weight:600}
button.s{background:#fff;color:#0F1B33;border:1px solid #C8CFDA}
table{width:100%;border-collapse:collapse}th{background:#F4F6FA;text-align:left;font-size:13px;color:#4A5568}th,td{padding:14px 16px;border-top:1px solid #E8EBF0}
.b{display:inline-block;padding:3px 10px;border-radius:99px;background:#E6EFFC;color:#174A99;font-size:13px;font-weight:600}
.sub{color:#4A5568;font-size:14px}.err{color:#B3261E;margin:8px 0}.box{max-width:400px;margin:64px auto}

.b.ok{background:#E3F6E8;color:#14612B}.b.no{background:#FDE7E5;color:#9B1C14}.b.warn{background:#FFF1D6;color:#8A5200}.b.int{background:#EDE7FB;color:#4B2A9B}.b.gr{background:#EEF0F4;color:#4A5568}.b.blue{background:#E6EFFC;color:#174A99}
.msg{margin-top:6px;font-size:13px;color:#4A5568}
/* Page de connexion / inscription (maquette) */
main.full{max-width:none;padding:0}
.auth{display:grid;grid-template-columns:53% 47%;min-height:100vh;background:#fff}
.hero{background:#1A2849;color:#fff;padding:48px 48px 40px;display:flex;flex-direction:column;justify-content:space-between}
.hero .logo{font-size:20px;font-weight:700;letter-spacing:-.3px}.hero .logo span{color:#8FD0FF}
.hero h2{font-size:clamp(32px,3.7vw,54px);line-height:1.08;margin:0 0 18px;font-weight:800;letter-spacing:-1px}
.hero p{margin:0;max-width:430px;line-height:1.45;font-size:clamp(14px,1.25vw,18px);color:#F1F4FA}
.hero small{color:#A9C4F2;font-size:13px}
.formside{display:flex;align-items:center;justify-content:center;padding:32px;background:#fff}
.formbox{width:100%;max-width:330px}
.tabs{display:flex;gap:64px;justify-content:center;margin-bottom:30px}
.tab{background:none;border:0;border-radius:0;min-height:28px;padding:0;font-size:13px;font-weight:500;color:#3B7FC4;cursor:pointer}
.tab.on{color:#0F1B33}
.formbox label{font-size:12px;font-weight:600;margin-bottom:14px;gap:6px;color:#0F1B33}
.formbox input,.formbox select{min-height:36px;font-size:13px;border:0;border-radius:0;padding:0 10px;background:#fff;color:#0F1B33}
.formbox select{padding:0 6px}
.formbox input::placeholder{color:#B8BFCB}
.formbox .go{width:100%;min-height:44px;margin-top:6px;border-radius:6px;background:#2F80FF;font-size:12px;font-weight:700;box-shadow:none}
@media(max-width:800px){.auth{grid-template-columns:1fr}.hero{display:none}}
</style></head><body><div id="nav"></div><main id="app"></main>
<script>
let token = localStorage.getItem('token');
const app = document.getElementById('app'), navEl = document.getElementById('nav');
const user = () => { try { return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); } catch (e) { return null; } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d).toLocaleDateString('fr-FR');

const STATUTS = ['Nouvelle','En cours de sélection','Entretien demandé','Admis','Refusé','Informations manquantes'];
const STATUT_CLASS = { 'Nouvelle':'gr', 'En cours de sélection':'blue', 'Entretien demandé':'int', 'Admis':'ok', 'Refusé':'no', 'Informations manquantes':'warn' };
const badge = st => `<span class="b ${STATUT_CLASS[st] || ''}">${esc(st)}</span>`;

async function api(path, o = {}) {
  o.headers = Object.assign({}, o.headers);
  if (token) o.headers.Authorization = 'Bearer ' + token;
  if (o.json) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(o.json); }
  const r = await fetch('/api' + path, o);
  if (o.blob) return r.ok ? r.blob() : Promise.reject(new Error(r.status));
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}
function logout() { localStorage.removeItem('token'); token = null; location.hash = '#/login'; }
async function openCv(id) { try { window.open(URL.createObjectURL(await api('/cv/' + id, { blob: true }))); } catch (e) { alert('CV indisponible : ' + e.message); } }

function renderNav(show = true) {
  const u = user();
  if (!u || !show) { navEl.innerHTML = ''; return; }
  const links = { candidat: [['#/jobs','Offres'],['#/mine','Mes candidatures']],
    recruteur: [['#/received','Candidatures'],['#/new','Publier une offre']],
    admin: [['#/admin','Utilisateurs'],['#/received','Candidatures']] }[u.role] || [];
  navEl.innerHTML = `<nav><div class="l"><b>Job<span>Board</span></b>${links.map(l => `<a href="${l[0]}">${l[1]}</a>`).join('')}</div>
    <div class="row"><span class="b">${esc(u.role)}</span><span class="sub">${esc(u.email)}</span><a href="#" id="lo">Se déconnecter</a></div></nav>`;
  document.getElementById('lo').onclick = e => { e.preventDefault(); logout(); };
}

const views = {
  login(mode = 'login') {
    const isLogin = mode === 'login';
    app.className = 'full';
    app.innerHTML = `<div class="auth">
      <aside class="hero">
        <div class="logo">Job<span>Board</span></div>
        <div><h2>Trouvez le poste.<br>Recrutez le bon profil.</h2>
        <p>Les candidats postulent avec leur CV, les recruteurs gèrent leurs offres et leurs candidatures.</p></div>
        <small>Projet DevSecOps · TEK-UP University</small>
      </aside>
      <section class="formside"><div class="formbox">
        <div class="tabs"><button type="button" class="tab ${isLogin ? 'on' : ''}" id="t-login">Connexion</button>
        <button type="button" class="tab ${isLogin ? '' : 'on'}" id="t-register">Inscription</button></div>
        <label>E-mail<input id="e" type="email" placeholder="nom@exemple.com"></label>
        <label>Mot de passe<input id="p" type="password" placeholder="Mot de passe"></label>
        <label>Je suis<select id="r"><option value="candidat">Candidat</option><option value="recruteur">Recruteur</option></select></label>
        <div id="m" class="err"></div><button id="go" class="go">${isLogin ? 'Se connecter' : "S'inscrire"}</button>
      </div></section></div>`;
    document.getElementById('t-login').onclick = () => views.login('login');
    document.getElementById('t-register').onclick = () => views.login('register');
    document.getElementById('go').onclick = async () => {
      const email = document.getElementById('e').value, password = document.getElementById('p').value;
      try {
        if (mode === 'register') { await api('/auth/register', { method: 'POST', json: { email, password, role: document.getElementById('r').value } }); }
        const d = await api('/auth/login', { method: 'POST', json: { email, password } });
        token = d.token; localStorage.setItem('token', token);
        location.hash = user().role === 'candidat' ? '#/jobs' : user().role === 'admin' ? '#/admin' : '#/received';
      } catch (e) { document.getElementById('m').textContent = e.message; }
    };
  },
  async jobs() {
    app.innerHTML = `<h1>Offres d'emploi</h1><div class="row card"><input id="q" placeholder="Rechercher par titre ou mot-clé"><button id="s">Rechercher</button></div><div id="list"></div>`;
    const load = async () => {
      try {
        const jobs = await api('/jobs?q=' + encodeURIComponent(document.getElementById('q').value));
        document.getElementById('list').innerHTML = jobs.map(j => `<div class="card row sp"><div><b>${esc(j.title)}</b>
          <div class="sub">${esc(j.company)} · ${esc(j.city)}</div><span class="b">${esc(j.contract)}</span></div>
          <button onclick="location.hash='#/apply/${esc(j.id)}'">Postuler</button></div>`).join('') || '<p class="sub">Aucune offre.</p>';
      } catch (e) { document.getElementById('list').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };
    document.getElementById('s').onclick = load; load();
  },
  async apply(id) {
    const j = await api('/jobs/' + id);
    // VULN-6 : la description est injectée telle quelle (XSS stocké)
    app.innerHTML = `<div class="card"><h1>${esc(j.title)}</h1><div class="sub">${esc(j.company)} · ${esc(j.city)} · ${esc(j.contract)}</div>
      <p>${j.description}</p></div><div class="card"><h2>Postuler à cette offre</h2>
      <label>Lettre de motivation<textarea id="cl" rows="5"></textarea></label><label>CV<input id="cv" type="file"></label>
      <div id="m" class="err"></div><button id="go">Envoyer ma candidature</button></div>`;
    document.getElementById('go').onclick = async () => {
      const fd = new FormData(); fd.append('job_id', id); fd.append('cover_letter', document.getElementById('cl').value);
      const f = document.getElementById('cv').files[0]; if (f) fd.append('cv', f);
      try { await api('/applications', { method: 'POST', body: fd }); location.hash = '#/mine'; }
      catch (e) { document.getElementById('m').textContent = e.message; }
    };
  },
  async mine() {
    const a = await api('/applications/mine');
    app.innerHTML = `<h1>Mes candidatures</h1><div class="card"><table><tr><th>Offre</th><th>Entreprise</th><th>Date</th><th>CV</th><th>Statut</th></tr>
      ${a.map(x => `<tr><td>${esc(x.title)}</td><td>${esc(x.company)}</td><td>${esc(fmt(x.created_at))}</td>
      <td><a href="#" onclick="openCv(${+x.id});return false">Voir mon CV</a></td>
      <td>${badge(x.status)}${x.recruiter_message ? `<div class="msg">Message du recruteur : ${esc(x.recruiter_message)}</div>` : ''}</td></tr>`).join('')}</table></div>`;
  },
  async received() {
    const a = await api('/applications/received');
    app.innerHTML = `<h1>Candidatures reçues</h1><div class="card"><table><tr><th>Candidat</th><th>Offre</th><th>Date</th><th>CV</th><th>Statut</th><th>Profil</th></tr>
      ${a.map(x => `<tr><td>${esc(x.candidate_email)}</td><td>${esc(x.title)}</td><td>${esc(fmt(x.created_at))}</td>
      <td><a href="#" onclick="openCv(${+x.id});return false">Voir le CV</a></td><td>${badge(x.status)}</td>
      <td><a href="#/profile/${+x.id}">Voir le profil</a></td></tr>`).join('')}</table></div>`;
  },
  async profile(id) {
    const a = await api('/applications/' + id);
    const u = user(), canEdit = u.role === 'recruteur' || u.role === 'admin';
    const returnTo = u.role === 'candidat' ? '#/mine' : '#/received';
    app.innerHTML = `<p><a href="${returnTo}">← Retour aux candidatures</a></p><h1>Profil du candidat</h1>
      <div class="card row sp"><div><b>${esc(a.candidate_email)}</b>
        <div class="sub">Candidature pour « ${esc(a.title)} » chez ${esc(a.company)} · ${esc(fmt(a.created_at))}</div></div>${badge(a.status)}</div>
      <div class="card"><h2>Lettre de motivation</h2><p>${esc(a.cover_letter) || '<span class="sub">Aucune lettre.</span>'}</p>
        <button class="s" onclick="openCv(${+a.id})">Voir le CV</button></div>
      ${canEdit ? `<div class="card"><h2>Décision</h2>
        <label>Statut<select id="st">${STATUTS.map(s => `<option${s === a.status ? ' selected' : ''}>${s}</option>`).join('')}</select></label>
        <label>Message pour le candidat (facultatif)<textarea id="msg" rows="3">${esc(a.recruiter_message)}</textarea></label>
        <div id="m" class="err"></div><button id="save">Enregistrer</button></div>` : ''}`;
    if (canEdit) document.getElementById('save').onclick = async () => {
      const m = document.getElementById('m');
      try {
        await api('/applications/' + id + '/status', { method: 'PATCH', json: { status: document.getElementById('st').value, message: document.getElementById('msg').value } });
        m.className = 'sub'; m.textContent = 'Statut enregistré.';
      } catch (e) { m.className = 'err'; m.textContent = e.message; }
    };
  },
  new() {
    app.innerHTML = `<div class="card"><h1>Publier une offre</h1><label>Titre<input id="t"></label>
      <div class="row"><label style="flex:1">Entreprise<input id="c"></label><label style="flex:1">Ville<input id="v"></label></div>
      <label>Contrat<select id="k"><option>CDI</option><option>CDD</option><option>Stage</option></select></label>
      <label>Description<textarea id="d" rows="6"></textarea></label><div id="m" class="err"></div><button id="go">Publier</button></div>`;
    document.getElementById('go').onclick = async () => {
      const g = i => document.getElementById(i).value;
      try { await api('/jobs', { method: 'POST', json: { title: g('t'), company: g('c'), city: g('v'), contract: g('k'), description: g('d') } }); location.hash = '#/received'; }
      catch (e) { document.getElementById('m').textContent = e.message; }
    };
  },
  async admin() {
    const [u, s] = await Promise.all([api('/admin/users'), api('/admin/stats')]);
    app.innerHTML = `<h1>Gestion des utilisateurs</h1><div class="row" style="margin-bottom:14px">
      <div class="card" style="flex:1">Utilisateurs<h1>${s.users}</h1></div><div class="card" style="flex:1">Offres<h1>${s.jobs}</h1></div><div class="card" style="flex:1">Candidatures<h1>${s.applications}</h1></div></div>
      <div class="card"><table><tr><th>E-mail</th><th>Rôle</th><th>Inscrit le</th><th>Statut</th><th>Actions</th></tr>
      ${u.map(x => `<tr><td>${esc(x.email)}</td><td><span class="b">${esc(x.role)}</span></td><td>${fmt(x.created_at)}</td><td>${x.active ? 'Actif' : 'Désactivé'}</td>
      <td><button class="s" onclick="deact(${+x.id})">Désactiver</button></td></tr>`).join('')}</table></div>`;
  }
};
async function deact(id) { await api('/admin/users/' + id + '/deactivate', { method: 'PATCH' }); route(); }

async function route() {
  const [, name, arg] = (location.hash || '#/').split('/');
  renderNav(name !== 'login');
  app.className = user() ? '' : 'full';
  if (!user()) return views.login();
  const def = { candidat: 'jobs', recruteur: 'received', admin: 'admin' }[user().role];
  try { await (views[name] || views[def])(arg); } catch (e) { app.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
window.onhashchange = route; route();
</script></body></html>
